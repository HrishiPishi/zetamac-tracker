<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zetamac Tracker</title>
  <style>
    body { width: 300px; margin: 0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f7f7f4; color: #1d1d1f; }
    main { padding: 16px; }
    h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -0.04em; }
    p { color: #696969; margin: 0 0 14px; line-height: 1.35; }
    .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .card { background: white; border: 1px solid #deded8; border-radius: 16px; padding: 12px; }
    .card span { display: block; font-size: 11px; color: #696969; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 800; }
    .card strong { font-size: 24px; }
    button { width: 100%; border: 0; border-radius: 999px; padding: 10px 12px; margin-top: 8px; color: white; background: #111; font: inherit; cursor: pointer; }
    button.secondary { background: white; color: #111; border: 1px solid #deded8; }
    #status { font-size: 13px; margin-top: 10px; min-height: 18px; color: #696969; }
  </style>
</head>
<body>
  <main>
    <h1>Zetamac Tracker</h1>
    <p>Auto-saves completed games and builds your progress dashboard.</p>
    <section class="cards">
      <div class="card"><span>today best</span><strong id="todayBest">—</strong></div>
      <div class="card"><span>plays today</span><strong id="playsToday">—</strong></div>
      <div class="card"><span>all best</span><strong id="allBest">—</strong></div>
      <div class="card"><span>total</span><strong id="totalPlays">—</strong></div>
    </section>
    <button id="dashboardBtn">open dashboard</button>
    <button id="saveBtn" class="secondary">save current score</button>
    <div id="status"></div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
