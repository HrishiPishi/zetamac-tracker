<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>zetamac tracker</title>
  <style>
    body { width: 280px; margin: 0; font-family: Arial, Helvetica, sans-serif; background: white; color: #111; font-size: 14px; }
    main { padding: 12px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p { color: #666; margin: 0 0 12px; line-height: 1.35; }
    .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .card { background: white; border: 1px solid #d0d0d0; padding: 10px; }
    .card span { display: block; font-size: 12px; color: #666; margin-bottom: 4px; }
    .card strong { font-size: 22px; line-height: 1; }
    button { width: 100%; border: 1px solid #111; padding: 7px 10px; margin-top: 7px; color: #111; background: #f5f5f5; font: inherit; cursor: pointer; }
    button.secondary { background: white; color: #111; border: 1px solid #aaa; }
    #status { font-size: 13px; margin-top: 9px; min-height: 18px; color: #666; }
  </style>
</head>
<body>
  <main>
    <h1>zetamac tracker</h1>
    <p>tracks scores and opens the dashboard</p>
    <section class="cards">
      <div class="card"><span>today best</span><strong id="todayBest">—</strong></div>
      <div class="card"><span>plays today</span><strong id="playsToday">—</strong></div>
      <div class="card"><span>all best</span><strong id="allBest">—</strong></div>
      <div class="card"><span>total</span><strong id="totalPlays">—</strong></div>
    </section>
    <button id="dashboardBtn">open dashboard</button>
    <button id="saveBtn" class="secondary">save current score</button>
    <div id="status"></div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
